{% extends 'base.html' %}

{% block title %}Сдача задания{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'control:homework_list' %}">Домашние задания</a></li>
                <li class="breadcrumb-item"><a href="{% url 'control:homework_detail' homework.id %}">{{ homework.title|truncatechars:30 }}</a></li>
                <li class="breadcrumb-item active">Сдача задания</li>
            </ol>
        </nav>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">Сдача задания: {{ homework.title }}</h5>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="submission_file" class="form-label">Файл с работой *</label>
                        <input type="file" class="form-control" id="submission_file" name="submission_file" required>
                        <small class="text-muted">Загрузите файл с выполненным заданием</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="comment" class="form-label">Комментарий</label>
                        <textarea class="form-control" id="comment" name="comment" rows="3" placeholder="Дополнительные комментарии к работе..."></textarea>
                    </div>
                    
                    <hr>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'control:homework_detail' homework.id %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Назад
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-upload me-2"></i>Отправить работу
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
